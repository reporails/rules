version: 3
generator: manual

agents:
  claude:
    main_instruction_file: CLAUDE.md
    config: agents/claude/config.yml
    skills: .claude/skills/
    tasks: .claude/tasks/
  codex:
    config: agents/codex/config.yml
  generic:
    config: agents/generic/config.yml
  copilot:
    main_instruction_file: .github/copilot-instructions.md
    config: agents/copilot/config.yml

rules:
  core: core/
  agents: agents/
  patterns:
    rule_dir: "{category}/{slug}/"
    definition: "rule.md"
    patterns_yml: "rule.yml"
    test_pass: "tests/pass/"
    test_fail: "tests/fail/"
  categories:
    structure: core/structure/
    content: core/content/
    context_quality: core/context_quality/
    efficiency: core/efficiency/
    maintenance: core/maintenance/
    governance: core/governance/
  agent_rules:
    claude: agents/claude/rules/
    codex: agents/codex/rules/
    copilot: agents/copilot/rules/

schemas:
  rule: schemas/rule.schema.yml
  capability: schemas/capability.schema.yml
  levels: schemas/levels.schema.yml
  agent: schemas/agent.schema.yml
  package: schemas/package.schema.yml
  project: schemas/project.schema.yml
  sources: schemas/sources.schema.yml
  user: schemas/user.schema.yml

registry:
  capabilities: registry/capabilities.yml
  levels: registry/levels.yml
  coordinate_map: registry/coordinate-map.yml
  tombstones: registry/tombstones.yml

meta:
  version_file: VERSION

docs:
  sources: docs/sources.yml
  rule_template: docs/rule-template.md

shared:
  knowledge: .shared/knowledge/
  workflows: .shared/workflows/
