# Rule frontmatter schema
version: "0.1.0"

types:
  - mechanical
  - deterministic
  - semantic

categories:
  - structure
  - content
  - efficiency
  - maintenance
  - governance

severities:
  - critical
  - high
  - medium
  - low

levels:
  - L1
  - L2
  - L3
  - L4
  - L5
  - L6

reserved_agent_prefixes:
  - CLAUDE
  - COPILOT
  - CODEX
  - CURSOR
  - WINDSURF
  - CLINE
  - AIDER
  - CONTINUE

reserved_package_prefixes:
  - RRAILS

fields:
  id:
    required: true
    type: string
    pattern:
      core: "^CORE:[SCEMG]:[0-9]{4}$"
      agent: "^[A-Z]+:[SCEMG]:[0-9]{4}$"
      package: "^[A-Z]{3,}:[SCEMG]:[0-9]{4}$"
      package_agent: "^[A-Z]{3,}_[A-Z]+:[SCEMG]:[0-9]{4}$"
      custom: "^[A-Z]{3,}:[SCEMG]:[0-9]{4}$"
    description: "Coordinate: {REGISTRY}:{CATEGORY}:{SLOT}. Immutable, never reused."

  slug:
    required: true
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: "Mutable display name, used as directory name"

  title:
    required: true
    type: string
    max_length: 64
    description: "Human-readable rule name (max 64 chars)"

  category:
    required: true
    type: enum
    values: [structure, content, efficiency, maintenance, governance]
    description: "Rule concern area. Maps to category letter in coordinate: S/C/E/M/G"

  type:
    required: true
    type: enum
    values: [mechanical, deterministic, semantic]
    description: "Validation constraint + CLI dispatch signal. Determines which engines load."

  level:
    required: true
    type: enum
    values: [L1, L2, L3, L4, L5, L6]
    description: "Concern level. Rule fires when rule.level ≤ project_level."

  targets:
    required: true
    type: string
    description: "Template var resolved against agent config. Always files."

  backed_by:
    required: false
    type: array
    description: "Evidence chain references. Links rule to verified claims."
    items:
      claim_id:
        required: true
        type: string
        pattern: "^claim:.+:.+$"
        description: "Claim coordinate (format: claim:{source}:{slug})"

  checks:
    required: true
    type: array
    min_items: 1
    description: "Ordered. Shape: [mechanical | deterministic]* → semantic?"
    items:
      id:
        required: true
        type: string
        pattern: "^[A-Z_]+:[SCEMG]:[0-9]{4}:check:[0-9]{4}$"
        description: "Check coordinate: {rule_id}:check:{slot}"
      type:
        required: true
        type: enum
        values: [mechanical, deterministic, semantic]
        description: "Gate type for this check step"
      severity:
        required: true
        type: enum
        values: [critical, high, medium, low]
        description: "Impact weight for scoring. Critical=5.5, High=4.0, Medium=2.5, Low=1.0"
      # mechanical
      check:
        required_if: "type == mechanical"
        type: string
        description: "Mechanical check function name (see values for available checks)"
        values:
          - file_exists
          - directory_exists
          - directory_contains
          - git_tracked
          - frontmatter_key
          - file_count
          - line_count
          - byte_size
          - path_resolves
          - extract_imports
      args:
        required: false
        type: object
        description: "Check-specific arguments (e.g., path, min, max)"
      # deterministic
      pattern:
        required_if: "type == deterministic"
        type: string
        description: "OpenGrep regex pattern to match violations"
      message:
        required_if: "type == deterministic"
        type: string
        description: "Human-readable violation message when pattern matches"
      cross_file:
        required: false
        type: boolean
        default: false
        description: "Whether pattern operates across the full target set (not per-file)"
      # semantic
      prompt:
        required_if: "type == semantic"
        type: string
        description: "Evaluation prompt sent to coding agent for LLM judgment"

  supersedes:
    required: false
    type: string
    pattern: "^[A-Z_]+:[SCEMG]:[0-9]{4}$"
    description: "Coordinate of replaced rule. Must be lower level. 1:1 only."

  see_also:
    required: false
    type: array
    description: "Related rule coordinates for cross-referencing"
    items:
      type: string
      pattern: "^[A-Z_]+:[SCEMG]:[0-9]{4}$"

  conflicts:
    required: false
    type: array
    description: "Known conflicts with other rules, with resolution status"
    items:
      conflict_id:
        required: true
        type: string
        description: "Reference to a resolution in docs/resolutions/"
      resolution_honored:
        required: true
        type: boolean
        description: "Whether this rule follows the published resolution"
      scoped_to:
        required: false
        type: string
        description: "Context scope where this conflict applies (e.g., monorepo, single-root)"

template_variables:
  universal:
    main_instruction_file: "Primary instruction file"
    instruction_files: "All instruction files (main + supplementary)"
  agent_specific:
    supplementary_files: "Rule snippet files (excludes main)"
    rules_dir: "Rules directory path"
    skills_dir: "Skills directory path"

validation:
  - rule: "Every checks[].id in rule.md must match a corresponding entry in rule.yml"
  - rule: "checks[].id format: {rule_id}:check:{slot}"
  - rule: "mechanical type: checks may only contain mechanical"
  - rule: "deterministic type: checks may contain mechanical + deterministic"
  - rule: "semantic type: any types allowed, semantic must be last"
  - rule: "supersedes target must be at a strictly lower level"
  - rule: "No circular supersessions"
  - rule: "Each rule may be superseded by at most one other rule"
  - rule: "Severity in rule.md is source of truth"
  - rule: "Slots are immutable — deleted rules are tombstoned, never reused"
  - rule: "Core rules may only use universal template variables"
  - rule: "Tier derived from backed_by: core (weight >= 0.8), experimental (< 0.8 or empty)"

examples:
  core_mechanical: |
    ---
    id: CORE:M:0001
    slug: version-controlled
    title: Version Controlled
    category: maintenance
    type: mechanical
    level: L1
    backed_by:
      - claim_id: "claim:claude-code-best-practices:version-control"
    targets: "{{instruction_files}}"
    checks:
      - id: CORE:M:0001:check:0001
        type: mechanical
        check: file_exists
        severity: critical
      - id: CORE:M:0001:check:0002
        type: mechanical
        check: git_tracked
        severity: critical
    see_also: [CLAUDE:M:0001]
    ---

  core_deterministic: |
    ---
    id: CORE:S:0001
    slug: size-limits
    title: Size Limits
    category: structure
    type: deterministic
    level: L2
    backed_by:
      - claim_id: "claim:claude-code-best-practices:keep-concise"
    targets: "{{main_instruction_file}}"
    checks:
      - id: CORE:S:0001:check:0001
        type: deterministic
        pattern: "(?s)(?:[^\\n]*\\n){200,}"
        message: "Root file exceeds 200 lines"
        severity: critical
      - id: CORE:S:0001:check:0002
        type: deterministic
        pattern: "(?s)(^## [^\\n]+\\n.*){6,}"
        message: "6+ top-level sections in large file"
        severity: high
    see_also: [CORE:S:0002, CORE:C:0001]
    ---

  core_semantic: |
    ---
    id: CORE:M:0002
    slug: no-conflicting-rules
    title: No Conflicting Rules
    category: maintenance
    type: semantic
    level: L3
    backed_by:
      - claim_id: "claim:claude-code-memory:keep-rules-focused"
    targets: "{{instruction_files}}"
    checks:
      - id: CORE:M:0002:check:0001
        type: deterministic
        pattern: "(?i)(MUST NOT|NEVER|ALWAYS|MUST)\\s"
        message: "Potentially conflicting directive detected"
        severity: high
      - id: CORE:M:0002:check:0002
        type: semantic
        prompt: "Given the matched directives, are there contradictory or conflicting rules?"
        severity: high
    see_also: [CORE:C:0002]
    ---

  agent_specific: |
    ---
    id: CLAUDE:S:0001
    slug: hierarchical-memory
    title: Hierarchical Memory
    category: structure
    type: mechanical
    level: L4
    backed_by:
      - claim_id: "claim:claude-code-memory:memory-hierarchy"
    targets: "{{rules_dir}}/**/*.md"
    checks:
      - id: CLAUDE:S:0001:check:0001
        type: mechanical
        check: directory_exists
        args:
          path: "{{rules_dir}}"
        severity: medium
    see_also: [CLAUDE:S:0002, CORE:S:0002]
    ---

  with_supersession: |
    ---
    id: CORE:C:0002
    slug: single-source-of-truth
    title: Single Source of Truth
    category: content
    type: semantic
    level: L3
    supersedes: CORE:C:0001
    backed_by:
      - claim_id: "claim:claude-code-best-practices:single-source"
    targets: "{{instruction_files}}"
    checks:
      - id: CORE:C:0002:check:0001
        type: deterministic
        pattern: "^## .+$"
        cross_file: true
        message: "Duplicate heading across files"
        severity: high
      - id: CORE:C:0002:check:0002
        type: semantic
        prompt: "Are these duplicate headings actual content duplication or scoped context?"
        severity: high
    ---
