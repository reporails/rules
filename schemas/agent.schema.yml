# Agent configuration schema
version: "0.1.0"

# Simplified from v0.0.2: removed pattern_overrides.
# instruction_files patterns live here (moved from project config).

fields:
  agent:
    required: true
    type: string
    pattern: "^[a-z]+$"
    description: "Agent identifier. Uppercase = coordinate registry prefix."

  version:
    required: true
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "Semver version of this agent configuration"

  prefix:
    required: false
    type: string
    pattern: "^[A-Z]+$"
    description: "Uppercase agent prefix for coordinate namespacing (e.g., CLAUDE, CODEX)"

  name:
    required: false
    type: string
    description: "Human-readable display name for the agent"

  vars:
    required: true
    type: object
    description: "Template variables resolved by CLI for rule targets and capability detection"
    properties:
      main_instruction_file:
        required: true
        type:
          oneOf: [string, array]
        description: "Primary instruction file glob(s) (e.g., '**/CLAUDE.md' or list)"
      instruction_files:
        required: true
        type:
          oneOf: [string, array]
        description: "All instruction files glob(s) (main + nested)"
      supplementary_files:
        required: false
        type:
          oneOf: [string, array]
        description: "Rule snippet files, excluding main instruction file"
      rules_dir:
        required: false
        type: string
        description: "Path-scoped rules directory"
      skills_dir:
        required: false
        type: string
        description: "Skills directory path"
    additionalProperties:
      type: string
      description: "Agent-specific vars (e.g., settings_file, mcp_config, memory_dir)"

  excludes:
    required: false
    type: array
    description: "Glob patterns to exclude from all rule target resolution"
    items:
      type: string

  overrides:
    required: false
    type: object
    description: "Per-rule severity overrides keyed by coordinate (e.g., RRAILS:C:0008)"
    additionalProperties:
      type: object
      properties:
        severity:
          type: string
          enum: [low, medium, high]

validation:
  - rule: "agent uppercase must be in reserved_agent_prefixes (see rule.schema.yml)"

examples:
  claude: |
    agent: claude
    version: "0.1.0"
    vars:
      main_instruction_file: "**/CLAUDE.md"
      instruction_files: "**/CLAUDE.md"
      supplementary_files: ".claude/rules/**/*.md"
      rules_dir: ".claude/rules"
      skills_dir: ".claude/skills"
      settings_file: ".claude/settings.json"
      mcp_config: ".mcp.json"
      memory_dir: "memory"
    excludes:
      - "node_modules/**"
      - ".git/**"
      - "archive/**"

  copilot: |
    agent: copilot
    version: "0.1.0"
    vars:
      main_instruction_file: ".github/copilot-instructions.md"
      instruction_files: ".github/copilot-instructions.md"

  cursor: |
    agent: cursor
    version: "0.1.0"
    vars:
      main_instruction_file: "**/.cursorrules"
      instruction_files: "**/.cursorrules"
      supplementary_files: ".cursor/rules/**/*.md"
      rules_dir: ".cursor/rules"
