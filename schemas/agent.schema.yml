# Agent configuration schema
version: "0.2.0"

fields:
  agent:
    required: true
    type: string
    pattern: "^[a-z]+$"
    description: "Agent identifier. Lowercase, used as config directory name."

  version:
    required: true
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "Semver version of this agent configuration"

  prefix:
    required: false
    type: string
    pattern: "^[A-Z]+$"
    description: "Uppercase agent prefix for coordinate namespacing (e.g., CLAUDE, CODEX)"

  name:
    required: false
    type: string
    description: "Human-readable display name for the agent"

  core:
    required: false
    type: boolean
    description: "If true, this config represents CORE itself"

  vars:
    required: true
    type: object
    description: >
      Template variables for rule target resolution and capability detection.
    properties:

      # --- Instruction files (required) ---
      main_instruction_file:
        required: true
        type:
          oneOf: [string, array]
        description: "Primary instruction file glob(s) (e.g., '**/CLAUDE.md')"
      instruction_files:
        required: true
        type:
          oneOf: [string, array]
        description: "All instruction file globs — main + supplementary + nested"

      # --- Modular rules ---
      supplementary_files:
        required: false
        type:
          oneOf: [string, array]
        description: "Path-scoped rule/instruction snippet file globs"
      rules_dir:
        required: false
        type: string
        description: "Directory containing supplementary rule files"

      # --- Skills ---
      skills_dir:
        required: false
        type: string
        description: "Skills directory path (e.g., '.claude/skills', '.agents/skills')"
      skill_entry_file:
        required: false
        type:
          oneOf: [string, array]
        description: "Skill entry point file glob(s) within skills_dir (e.g., '**/SKILL.md')"

      # --- Configuration ---
      settings_file:
        required: false
        type: string
        description: "Agent settings/config file in the repository"
      mcp_config:
        required: false
        type: string
        description: "MCP server configuration file path (e.g., '.mcp.json')"

      # --- Overrides ---
      local_file:
        required: false
        type:
          oneOf: [string, array]
        description: "Local override file(s) — gitignored, highest user precedence"
      override_file:
        required: false
        type:
          oneOf: [string, array]
        description: "Override instruction file(s) — may be VCS-tracked, takes priority over main"

      # --- Enterprise/managed ---
      managed_config:
        required: false
        type:
          oneOf: [string, array]
        description: "Admin/enterprise managed config path(s) — cannot be overridden by users"

      # --- Memory ---
      memory_dir:
        required: false
        type: string
        description: "Persistent memory/context directory"

      # --- Limits ---
      token_budget:
        required: false
        type:
          oneOf: [string, integer]
        description: "Explicit instruction file size limit (e.g., '32KB')"

      # --- Discovery ---
      fallback_filenames:
        required: false
        type: array
        description: "Alternative instruction filenames in discovery order"

    additionalProperties:
      type: string
      description: "Agent-specific vars not yet in the common schema"

  excludes:
    required: false
    type: array
    description: "Rule coordinates or glob patterns to exclude from resolution"
    items:
      type: string
      pattern: "^[A-Z_]+:[SCXEMG*]:[0-9]{4}$|^[A-Z_]+:\\*$"

  overrides:
    required: false
    type: object
    description: "Per-rule severity overrides keyed by coordinate (e.g., RRAILS:C:0008)"
    additionalProperties:
      type: object
      properties:
        severity:
          type: enum
          values: [critical, high, medium, low]

validation:
  - rule: "agent uppercase must be in reserved_agent_prefixes (see rule.schema.yml)"

examples:
  claude: |
    agent: claude
    version: "0.2.0"
    prefix: CLAUDE
    name: Claude Code
    vars:
      main_instruction_file:
        - "**/CLAUDE.md"
      instruction_files:
        - "**/CLAUDE.md"
        - ".claude/rules/**/*.md"
      supplementary_files: ".claude/rules/**/*.md"
      rules_dir: ".claude/rules"
      skills_dir: ".claude/skills"
      skill_entry_file: ".claude/skills/**/SKILL.md"
      settings_file: ".claude/settings.json"
      mcp_config: ".mcp.json"
      local_file: "CLAUDE.local.md"
      memory_dir: ".claude/memory"
      managed_config:
        - "/etc/claude-code/managed-settings.json"
        - "/Library/Application Support/ClaudeCode/managed-settings.json"
    excludes:
      - CORE:C:0026

  codex: |
    agent: codex
    version: "0.2.0"
    prefix: CODEX
    name: OpenAI Codex
    vars:
      main_instruction_file:
        - "**/AGENTS.md"
      instruction_files:
        - "**/AGENTS.md"
        - "**/AGENTS.override.md"
      override_file: "AGENTS.override.md"
      skills_dir: ".agents/skills"
      skill_entry_file: ".agents/skills/**/SKILL.md"
      token_budget: "32KB"
      fallback_filenames:
        - "TEAM_GUIDE.md"
        - ".agents.md"

  copilot: |
    agent: copilot
    version: "0.2.0"
    prefix: COPILOT
    name: GitHub Copilot
    vars:
      main_instruction_file:
        - ".github/copilot-instructions.md"
      instruction_files:
        - ".github/copilot-instructions.md"
        - ".github/instructions/**/*.instructions.md"
      supplementary_files: ".github/instructions/**/*.instructions.md"
      rules_dir: ".github/instructions"
      skills_dir: ".github/skills"
      skill_entry_file: ".github/skills/**/SKILL.md"

  cursor: |
    agent: cursor
    version: "0.2.0"
    prefix: CURSOR
    name: Cursor
    vars:
      main_instruction_file:
        - ".cursorrules"
      instruction_files:
        - ".cursorrules"
        - ".cursor/rules/**/*.mdc"
      supplementary_files: ".cursor/rules/**/*.mdc"
      rules_dir: ".cursor/rules"
      skills_dir: ".cursor/skills"
      skill_entry_file: ".cursor/skills/**/SKILL.md"