# OpenAI Codex Agent Configuration
# Schema: schemas/agent.schema.yml v0.2.0

agent: codex
version: "0.2.0"
prefix: CODEX
name: OpenAI Codex

vars:
  # Instruction files
  main_instruction_file:
    - "**/AGENTS.md"
  instruction_files:
    - "**/AGENTS.md"
    - "**/AGENTS.override.md"

  # Overrides
  override_file: "AGENTS.override.md"

  # Skills
  skills_dir: ".agents/skills"
  skill_entry_file: ".agents/skills/**/SKILL.md"

  # Limits
  token_budget: "32KB"

  # Discovery
  fallback_filenames:
    - "TEAM_GUIDE.md"
    - ".agents.md"