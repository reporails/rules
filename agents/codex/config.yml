# OpenAI Codex Agent Configuration
# Schema: schemas/agent.schema.yml

agent: codex
version: "0.1.0"
prefix: CODEX
name: OpenAI Codex

vars:
  # Universal (required for all agents)
  main_instruction_file:
    - "**/AGENTS.md"
  instruction_files:
    - "**/AGENTS.md"
    - "**/AGENTS.override.md"

  # Agent-specific
  override_file: "AGENTS.override.md"
  size_limit_kb: 32

# No severity overrides — all moved to reporails/recommended
# No core rules excluded — Codex supports generic patterns
