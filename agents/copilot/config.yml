# GitHub Copilot Agent Configuration
# Schema: schemas/agent.schema.yml v0.2.0

agent: copilot
version: "0.2.0"
prefix: COPILOT
name: GitHub Copilot

vars:
  # Instruction files
  main_instruction_file:
    - ".github/copilot-instructions.md"
  instruction_files:
    - ".github/copilot-instructions.md"
    - ".github/instructions/**/*.instructions.md"

  # Modular rules
  supplementary_files:
    - ".github/instructions/**/*.instructions.md"
  rules_dir: ".github/instructions"

  # Skills
  skills_dir: ".github/skills"
  skill_entry_file: ".github/skills/**/SKILL.md"

excludes:
  - CLAUDE:*     # All Claude-specific rules excluded
  - CODEX:*      # All Codex-specific rules excluded