# GitHub Copilot CLI Agent Configuration
# Schema: schemas/agent.schema.yml

agent: copilot
version: "0.1.0"
prefix: COPILOT
name: GitHub Copilot CLI

vars:
  # Universal (required for all agents)
  main_instruction_file:
    - ".github/copilot-instructions.md"
  instruction_files:
    - ".github/copilot-instructions.md"
  
  # Agent-specific (Copilot CLI supports skills and path-scoped rules)
  skills_dir: ".claude/skills"
  
excludes:
  - CLAUDE:*     # All Claude-specific rules excluded
  - CODEX:*      # All Codex-specific rules excluded

# No severity overrides — all moved to reporails/recommended
