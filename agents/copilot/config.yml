# GitHub Copilot CLI Agent Configuration
# Schema: schemas/agent.schema.yml

agent: copilot
version: "0.1.0"
prefix: COPILOT
name: GitHub Copilot CLI

vars:
  # Universal (required for all agents)
  main_instruction_file:
    - ".github/copilot-instructions.md"
  instruction_files:
    - ".github/copilot-instructions.md"
  
  # Agent-specific
  # Note: Copilot CLI currently doesn't support path-scoped rules directory
  # or skills directory like Claude. Instructions are in single file.
  
excludes:
  - CORE:S:0010  # Cross-agent compatibility — AGENTS.md is not a Copilot surface
  - CLAUDE:*     # All Claude-specific rules excluded

# No severity overrides — all moved to reporails/recommended
