rules:
  - id: "CLAUDE.S.0008.check.0001"
    message: "Skills or subagent documentation found"
    severity: WARNING
    languages: [generic]
    pattern-either:
      - pattern-regex: "(?i)(## skills|SKILL\\.md)"
      - pattern-regex: "(?i)(skill|subagent)"
      - pattern-regex: "/[a-z]+-[a-z]+"
    paths:
      include:
        - "{{instruction_files}}"
