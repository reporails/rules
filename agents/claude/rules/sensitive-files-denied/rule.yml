rules:
  - id: "CLAUDE.S.0011.check.0001"
    message: "Deny pattern for sensitive files found in settings"
    severity: WARNING
    languages: [json]
    pattern-regex: "(?i)(deny|block).*(\\.env|\\.pem|\\.key|credentials|secrets)"
    paths:
      include:
        - ".claude/settings.json"
        - ".claude/settings.local.json"
