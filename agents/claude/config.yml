# Claude Code Agent Configuration
# Schema: schemas/agent.schema.yml v0.2.0

agent: claude
version: "0.2.0"
prefix: CLAUDE
name: Claude Code

vars:
  # Instruction files
  main_instruction_file:
    - "**/CLAUDE.md"
  instruction_files:
    - "**/CLAUDE.md"
    - ".claude/rules/**/*.md"

  # Modular rules
  supplementary_files:
    - ".claude/rules/**/*.md"
  rules_dir: ".claude/rules"

  # Skills
  skills_dir: ".claude/skills"

  # Configuration
  settings_file: ".claude/settings.json"
  mcp_config: ".mcp.json"

  # Overrides
  local_file: "CLAUDE.local.md"

  # Enterprise/managed
  managed_config:
    - "/etc/claude-code/managed-settings.json"
    - "/Library/Application Support/ClaudeCode/managed-settings.json"
    - "C:/Program Files/ClaudeCode/managed-settings.json"

  # Memory
  memory_dir: ".claude/memory"

excludes:
  - CORE:C:0026  # Cross-agent compatibility — AGENTS.md is not a Claude surface
