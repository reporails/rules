rules:
- id: CORE.C.0030.no_boilerplate_markers
  message: No boilerplate markers
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - '{{instruction_files}}'
  pattern-regex: '(?i)(?:auto[- ]?generated|do not edit|generated by|template default|placeholder|TODO:
    fill in|YOUR .* HERE)'
