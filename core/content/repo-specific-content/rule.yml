rules:
  - id: "CORE.C.0017.check.0001"
    message: "Project-specific path reference found"
    severity: WARNING
    languages: [generic]
    pattern-either:
      - pattern-regex: "(src/|tests/|lib/|app/)"
      - pattern-regex: "(\\./|\\.\\w+rc|package\\.json|Makefile|Dockerfile)"
    paths:
      include:
        - "{{instruction_files}}"
