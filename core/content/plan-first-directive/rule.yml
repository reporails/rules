rules:
- id: CORE.C.0004.extract_plan_directives
  message: Plan directives not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: (?i)(?:(?:before|prior 
      to)\s+(?:implement|cod|writ|start|build)|(?:plan|investigate|understand|analyze)\s+(?:first|before)|approach\s+(?:the|to|for)|task|requirement)
  - pattern-not-regex: 
      (?i)(?:(?:plan|investigate|understand|analyze|research|read)\s+(?:before|first|prior)|\b(?:before
      (?:writing|coding|implementing)|plan.first|think.before|investigate.before|understand.before)\b)
