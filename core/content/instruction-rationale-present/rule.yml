rules:
- id: CORE.C.0002.extract_rationale_content
  message: Rationale content not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: 
      (?i)(?:\b(?:because|reason|rationale|motivation|context|why we|this (?:is 
      because|ensures|prevents|avoids|helps)|so that|in order to)\b)
