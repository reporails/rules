rules:
- id: CORE.C.0025.has_format_directives
  message: Format directives not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{instruction_files}}'
  patterns:
  - pattern-regex: 
      (?i)\b(?:output|response|reply|message|format|verbose|concise|template|markdown|json|yaml)\b
  - pattern-not-regex: 
      (?i)(?:(?:output|response|format)\s+(?:as|in|using|with|should|must)|\b(?:verbosity|template|format
      (?:as|in|using)|respond (?:with|in|using))\b)
