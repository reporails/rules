rules:
- id: CORE.C.0029.no_ephemeral_markers
  message: No ephemeral markers
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{instruction_files}}'
  pattern-regex: (?i)(?:TODO:\s|FIXME:\s|HACK:\s|TEMP:\s|TEMPORARY:|currently 
    working on|right now I need|for this sprint|this week|today's task)
