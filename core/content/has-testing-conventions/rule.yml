rules:
  - id: "CORE.C.0004.check.0001"
    message: "Testing conventions documented"
    severity: WARNING
    languages: [generic]
    pattern-either:
      - pattern-regex: "(?i)## test"
      - pattern-regex: "(?i)(pytest|jest|vitest|mocha|unittest|rspec)"
      - pattern-regex: "(test_\\*|\\*\\.test\\.|\\*\\.spec\\.)"
    paths:
      include:
        - "{{instruction_files}}"
