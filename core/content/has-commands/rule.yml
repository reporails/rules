rules:
  - id: "CORE.C.0003.check.0001"
    message: "Executable commands found in instruction file"
    severity: WARNING
    languages: [generic]
    pattern-either:
      - pattern-regex: "`[a-z]+ .+`"
      - pattern-regex: "\\$ [a-z]+"
    paths:
      include:
        - "{{instruction_files}}"
