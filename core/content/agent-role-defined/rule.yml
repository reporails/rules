rules:
- id: CORE.C.0014.extract_role_content
  message: Role content not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{instruction_files}}'
  patterns:
  - pattern-regex: (?i)(?:you (?:are|should be|must be|will)|your 
      (?:role|job|responsibility|purpose)|(?:act|serve) 
      as|persona|identity|expert)
  - pattern-not-regex: (?i)(?:(?:you are|act as|role:|persona:|your 
      role)|\b(?:senior (?:engineer|developer)|expert in|specialist|you 
      (?:are|should act as))\b)
