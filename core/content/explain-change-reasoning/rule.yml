rules:
- id: CORE.C.0028.extract_reasoning_directives
  message: Reasoning directives not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: (?i)(?:explain (?:your |the 
      )?(?:reasoning|rationale|why)|state (?:the )?(?:reason|rationale)|describe
      (?:why|your reasoning))
