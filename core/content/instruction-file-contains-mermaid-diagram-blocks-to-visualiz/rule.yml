rules:
- id: CORE.C.0031.has_mermaid_blocks
  message: Mermaid blocks not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: 
      (?i)\b(?:workflow|pipeline|decision.tree|state.machine|flowchart|sequence|multi.step|(?:step|phase|stage)\s+\d)\b
  - pattern-not-regex: (?s)```mermaid\b
