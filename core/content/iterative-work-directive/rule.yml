rules:
- id: CORE.C.0003.extract_iteration_directives
  message: Iteration directives not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: 
      (?i)(?:(?:implement|develop|build|create|add|write)\s+\w|(?:approach|methodology|strateg|workflow)\s+(?:for|when|to)|step.by.step|incremental|iterative)
  - pattern-not-regex: (?i)(?:(?:small|incremental|iterative|one (?:at a 
      time|function|bug|feature|step))|\b(?:iterate|chunk|decompose|break 
      (?:into|down)|step.by.step|manageable)\b)
