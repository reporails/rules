rules:
  - id: "CORE.C.0025.check.0001"
    message: "Code example or file reference found"
    severity: WARNING
    languages: [generic]
    pattern-either:
      - pattern-regex: "```"
      - pattern-regex: "src/[a-z]"
      - pattern-regex: "see .+\\.[a-z]+:[0-9]"
    paths:
      include:
        - "{{instruction_files}}"
