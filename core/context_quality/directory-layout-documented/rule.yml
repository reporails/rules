rules:
- id: CORE.X.0003.has_directory_notation
  message: Directory notation not found
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: 
      (?:^\s*[├└│─┌┐┘┤┬┴┼|+`\-]{2,}|\b(?:src/|tests?/|lib/|config/|docs?/|scripts?/|packages?/)\b|^\s{2,}[└├])
