rules:
- id: CORE.S.0012.discovery_documented
  message: Discovery documented not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{instruction_files}}'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: 
      (?i)(fallback|priority|override|precedence|discovery.order|checked.first)
