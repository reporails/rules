rules:
- id: CORE.S.0034.discovery_chain_documented
  message: Discovery chain documented not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: 
      (?i)(?:AGENTS\.override|override.*fallback|fallback.*filename|project_doc_fallback|discovery.*order|precedence.*override)
