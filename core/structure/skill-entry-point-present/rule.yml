rules:
- id: CORE.S.0016.has_required_sections
  message: Required sections not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{skills_dir}}/**/*.md'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: (?i)^#{1,3}\s+(name|description|process|workflow|steps)
