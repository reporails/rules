rules:
- id: CORE.S.0016.has_overview_section
  message: Overview section not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: 
      (?i)^#{1,2}\s+(?:overview|introduction|about|summary|getting started)
