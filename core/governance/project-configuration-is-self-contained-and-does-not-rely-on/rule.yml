rules:
- id: CORE.G.0008.extract_settings_refs
  message: Settings refs not found
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '{{main_instruction_file}}'
  patterns:
  - pattern-regex: (?s)\A[\s\S]+
  - pattern-not-regex: (?i)(?:user[- 
      ]?(?:level|scope|settings|config)|~/\.claude|\$HOME/\.claude|personal 
      settings|local setup required)
