# Canonical level definitions for the Reporails framework.
# Source of truth: docs/capability-levels.md (Capability Assessment Matrix)
#
# CLI consumers should prefer this file over any bundled copy.

levels:
  L0:
    name: Absent
    description: No instruction file
    rules: []

  L1:
    name: Basic
    description: Instruction file exists, reviewed, has basic content
    rules: [CLAUDE_M1, M1]

  L2:
    name: Scoped
    description: Project-specific constraints, size limits, content quality
    rules: [S1, S2, S3, S4, C1, C3, C5]

  L3:
    name: Structured
    description: Clear sections, external references, organized content
    rules: [C2, C4, E1, E2, M2]

  L4:
    name: Abstracted
    description: Rules directory, path-scoped loading
    rules: [CLAUDE_S1, CLAUDE_S2]

  L5:
    name: Maintained
    description: Map and index maintenance discipline
    rules: [M3, M4]

  L6:
    name: Adaptive
    description: Backbone-driven navigation, contracts (detection-only)
    rules: []
