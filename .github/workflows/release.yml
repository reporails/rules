name: Release

on:
  push:
    branches: [main]

jobs:
  check-release:
    name: Check if release needed
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare VERSION against existing tags
        id: check
        run: |
          VERSION=$(cat VERSION)
          if [ -z "$VERSION" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "VERSION file is empty"
          elif git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists — not a release"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Release detected: $VERSION"
          fi

  qa:
    name: QA gate
    needs: check-release
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: Re-enable when reporails-cli 0.5.0 is published on PyPI
      # - name: Build test image
      #   run: docker build -t reporails-test runtime/
      #
      # - name: Run test harness
      #   run: |
      #     docker run --rm \
      #       -v ${{ github.workspace }}:/rules:ro \
      #       reporails-test

      - name: Validate schemas have versions
        run: |
          for schema in schemas/*.schema.yml; do
            if ! grep -q '^version:' "$schema"; then
              echo "ERROR: $schema missing version field"
              exit 1
            fi
          done

  publish:
    name: Publish release
    needs: [check-release, qa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"

          echo "release: \"${VERSION}\"" > manifest.yml
          echo "schemas:" >> manifest.yml

          for schema in schemas/*.schema.yml; do
            name=$(basename "$schema" .schema.yml)
            version=$(grep '^version:' "$schema" | head -1 | awk '{print $2}' | tr -d '"')
            echo "  ${name}: \"${version}\"" >> manifest.yml
          done

      - name: Create tarball
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"

          tar -czvf reporails-rules-${VERSION}.tar.gz \
            manifest.yml \
            registry/levels.yml \
            registry/capabilities.yml \
            registry/coordinate-map.yml \
            core/ \
            agents/ \
            schemas/ \
            docs/capability-levels.md \
            docs/methodology-thresholds.md \
            docs/sources.yml

          sha256sum reporails-rules-${VERSION}.tar.gz > checksums.txt

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            reporails-rules-${VERSION}.tar.gz \
            checksums.txt
